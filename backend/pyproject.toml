[project]
name = "backend"
version = "1.0.0"
description = "API de inventario TecnoStock (FastAPI + pyodbc + SQL Server)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pyodbc>=5.3.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend.main:run"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
